name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # The years-of-experience figure is computed at build time, so rebuild on
    # the 1st of every month: the work anniversary (1 September) then rolls
    # over on its own, without waiting for the next push.
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        # Must run after setup-node so the shims land in the selected Node's
        # bin dir, and before any yarn call — otherwise the runner's global
        # yarn 1.x answers first and rejects the "packageManager" pin.
        run: corepack enable

      - name: Install dependencies
        # --immutable fails if yarn.lock would change, which also means the
        # npmMinimalAgeGate stays enforced in CI.
        run: yarn install --immutable

      - name: Lint
        run: |
          yarn lint
          yarn format:check

      - name: Build
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages' queue has sat on a deployment until the step aborted. Note
          # this input did not visibly extend the window in one observed run:
          # 1500000 was passed and it still gave up after ~600s. Kept because
          # it is harmless, but do not count on it — if a deploy aborts, the
          # fix is a fresh commit, since the deployment id is the commit SHA.
          timeout: 1500000
